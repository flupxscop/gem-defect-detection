name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gemscan .
      - name: Smoke test
        run: |
          docker run -d --name gemscan -p 7860:7860 gemscan
          for i in $(seq 1 60); do curl -sf localhost:7860/api/health && break; sleep 2; done
          curl -sf localhost:7860/api/health | grep '"status":"ok"'
          curl -sf -F file=@web/public/samples/sample-1.jpg -F model=both localhost:7860/api/predict | python -m json.tool | head -20
